<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05070f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Stellar Dominion">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Stellar Dominion</title>
<style>
:root{
  --bg:#03050c; --panel:rgba(12,18,34,.94); --panel2:rgba(22,30,52,.95); --line:#24314f;
  --text:#d8e2f2; --muted:#8393b0; --accent:#4fc3f7; --good:#66bb6a; --bad:#ef5350; --warn:#ffca28;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font:14px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;user-select:none;-webkit-user-select:none}
canvas#map{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
button{font:inherit;color:var(--text);background:#1b2742;border:1px solid #2f4170;border-radius:8px;
  padding:6px 10px;cursor:pointer;min-height:34px}
button:hover:not(:disabled){background:#243457;border-color:#4a64a8}
button:disabled{opacity:.42;cursor:default}
button.primary{background:#1d5c86;border-color:#3a8cc4}
button.danger{background:#6a1f28;border-color:#a33a48}
button.good{background:#1f5a2c;border-color:#3d9b52}
button.x{background:transparent;border:none;font-size:18px;padding:2px 8px;min-height:30px}
input,select{font:inherit;color:var(--text);background:#0f1729;border:1px solid #2f4170;border-radius:8px;padding:8px}
.hidden{display:none!important}
.muted{color:var(--muted)}
small{color:var(--muted)}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;flex:none;border:1px solid rgba(255,255,255,.35)}
.pl{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}

/* top bar */
#topbar{position:fixed;top:0;left:0;right:0;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;
  padding:6px 10px;padding-top:max(6px,env(safe-area-inset-top));background:linear-gradient(#0a1022f2,#0a1022d0);
  border-bottom:1px solid var(--line);z-index:5}
#topbar .emp{display:flex;align-items:center;gap:6px;font-weight:600;max-width:180px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#topbar .res{display:flex;align-items:baseline;gap:3px;background:#111a30;border:1px solid var(--line);border-radius:8px;padding:3px 8px;white-space:nowrap}
#topbar .res small{font-size:11px}
#topbar .res .pos{color:var(--good)} #topbar .res .neg{color:var(--bad)}
#topbar .date{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
#topbar .speed{display:flex;gap:3px}
#topbar .speed button{min-width:38px;padding:4px 6px;min-height:32px}
#topbar .speed button.on{background:#1d5c86;border-color:#4fc3f7}
#topbar .menu{display:flex;gap:4px;margin-left:auto}
#topbar .menu button{padding:4px 9px;min-height:32px}
#tb-research{cursor:pointer}

/* side panel */
#panel{position:fixed;right:10px;top:64px;width:340px;max-height:calc(100% - 76px);overflow-y:auto;
  background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;z-index:4;
  box-shadow:0 6px 30px rgba(0,0,0,.5)}
#panel h4{margin:12px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.ph{display:flex;align-items:center;gap:8px}
.ph .pt{flex:1;min-width:0} .ph .pt b{display:block;font-size:16px} .ph .pt small{display:block}
.sub{margin:6px 0;color:var(--muted);font-size:13px}
.kv{display:flex;justify-content:space-between;gap:8px;margin:3px 0}
.bar{height:6px;background:#0b1222;border-radius:4px;overflow:hidden;border:1px solid #1d2a47}
.bar>i{display:block;height:100%;background:var(--accent);width:0}
.bar.def>i{background:#7e9cff} .bar.hp>i{background:var(--good)} .bar.col>i{background:var(--warn)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.opt{display:flex;flex-direction:column;align-items:flex-start;text-align:left;padding:6px 8px;gap:1px}
.opt b{font-size:13px} .opt small{font-size:11px;line-height:1.2}
.row{display:flex;align-items:center;gap:6px;padding:4px 0;border-bottom:1px solid #18223b}
.row:last-child{border-bottom:none}
.row .grow{flex:1;min-width:0}
.row button{min-height:28px;padding:2px 8px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{background:#16213b;border:1px solid var(--line);border-radius:6px;padding:2px 6px;font-size:12px;display:inline-flex;align-items:center;gap:4px}
.chip button{min-height:20px;padding:0 4px;border:none;background:transparent;color:var(--muted)}
.hint{margin-top:10px;padding:8px;border-radius:8px;background:#10243a;border:1px solid #1f4a6e;color:#a9d7f5;font-size:13px}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}

/* toasts */
#toasts{position:fixed;left:50%;transform:translateX(-50%);top:70px;z-index:8;display:flex;flex-direction:column;gap:6px;
  align-items:center;pointer-events:none;width:min(92vw,460px)}
.toast{pointer-events:auto;background:var(--panel2);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;
  padding:8px 12px;box-shadow:0 4px 18px rgba(0,0,0,.5);animation:tin .25s ease-out;cursor:pointer;width:100%}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}

/* floating map controls */
#mapctl{position:fixed;left:10px;bottom:max(12px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px;z-index:3}
#mapctl button{width:42px;height:42px;font-size:18px;padding:0;background:rgba(20,30,52,.85)}

/* modal */
#modal{position:fixed;inset:0;background:rgba(2,4,10,.6);z-index:10;display:flex;align-items:center;justify-content:center;padding:12px}
.modal-box{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:min(980px,100%);max-height:100%;display:flex;flex-direction:column;
  box-shadow:0 10px 50px rgba(0,0,0,.6)}
.modal-box.small{width:min(460px,100%)}
.modal-head{display:flex;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.modal-head h2{margin:0;font-size:18px;flex:1}
#modal-body{overflow-y:auto;padding:12px 14px}
.techgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.techcol h3{margin:0 0 6px;font-size:13px;text-transform:uppercase;color:var(--muted);letter-spacing:.06em}
.tech{display:block;width:100%;text-align:left;margin-bottom:6px;padding:7px 9px;position:relative;overflow:hidden}
.tech b{display:block;font-size:13px} .tech small{display:block;font-size:11px}
.tech.done{background:#173a24;border-color:#2f7a45;opacity:1}
.tech.active{background:#173452;border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.tech.locked{opacity:.4}
.tech .tp{position:absolute;left:0;bottom:0;height:3px;background:var(--accent)}
.dcard{background:#0f1729;border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px}
.dh{display:flex;align-items:center;gap:8px}
.dh b{flex:1}
.badge{font-size:11px;padding:2px 7px;border-radius:10px;text-transform:uppercase;letter-spacing:.05em;border:1px solid}
.badge.war{color:#ff8a80;border-color:#a33a48;background:#3a1218}
.badge.peace{color:#b0bec5;border-color:#455a64;background:#18222b}
.badge.alliance{color:#a5d6a7;border-color:#3d9b52;background:#13301b}
.badge.dead{color:#777;border-color:#444}
.log{font-size:13px;max-height:260px;overflow-y:auto}
.log div{padding:2px 0;border-bottom:1px solid #141d33}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}

/* full screens */
#screen{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px;
  background:radial-gradient(ellipse at 30% 20%,#1a2350 0%,#070a18 55%,#020309 100%);overflow-y:auto}
.scr{width:min(520px,100%);text-align:center}
.scr h1{font-size:clamp(34px,8vw,56px);margin:0 0 4px;letter-spacing:.08em;
  background:linear-gradient(90deg,#9be7ff,#4fc3f7,#b39ddb);-webkit-background-clip:text;background-clip:text;color:transparent}
.scr .tag{color:var(--muted);margin-bottom:24px}
.scr .menu-btns{display:flex;flex-direction:column;gap:10px;max-width:300px;margin:0 auto}
.scr .menu-btns button{padding:12px;font-size:16px}
.form{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.form label{display:flex;flex-direction:column;gap:5px;color:var(--muted);font-size:13px}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.swatch{width:34px;height:34px;border-radius:50%;border:2px solid transparent;cursor:pointer;min-height:0;padding:0}
.swatch.on{border-color:#fff;box-shadow:0 0 0 2px #000 inset}
.help{text-align:left;font-size:14px}
.help h3{margin:14px 0 4px;color:var(--accent);font-size:15px}
.help ul{margin:4px 0;padding-left:20px}
.help table{border-collapse:collapse;font-size:13px}
.help td,.help th{border:1px solid var(--line);padding:3px 7px}

@media (max-width:760px){
  body{font-size:13px}
  #topbar{gap:4px 6px;padding:4px 6px;padding-top:max(4px,env(safe-area-inset-top))}
  #topbar .emp{display:none}
  #topbar .res{padding:2px 6px;font-size:12px}
  #topbar .date{font-size:11px}
  #topbar .speed{gap:2px}
  #topbar .speed button{min-width:30px;font-size:12px;min-height:30px;padding:2px 4px}
  #topbar .menu{margin-left:auto;gap:3px}
  #topbar .menu button{font-size:12px;padding:2px 6px;min-height:30px}
  #topbar .menu .long{display:none}
  #panel{left:0;right:0;top:auto;bottom:0;width:auto;max-height:52vh;border-radius:14px 14px 0 0;
    padding-bottom:max(10px,env(safe-area-inset-bottom))}
  #mapctl.up{bottom:calc(52vh + 8px)}
  .techgrid{grid-template-columns:1fr 1fr}
  .cols{grid-template-columns:1fr}
  #toasts{top:84px}
}
@media (max-width:420px){ .techgrid{grid-template-columns:1fr} }
</style>
</head>
<body>
<canvas id="map"></canvas>

<div id="topbar" class="hidden">
  <div class="emp"><span class="dot" id="tb-color"></span><span id="tb-name"></span></div>
  <div class="res" title="Energy (credits) — pays upkeep for ships and buildings">⚡<span id="tb-en">0</span><small id="tb-enr"></small></div>
  <div class="res" title="Minerals — used to construct buildings and ships">◆<span id="tb-mi">0</span><small id="tb-mir"></small></div>
  <div class="res" id="tb-research" data-act="openTech" title="Research — click to open the tech tree">🔬<span id="tb-re">0</span><small id="tb-rer"></small></div>
  <div class="date" id="tb-date"></div>
  <div class="speed">
    <button data-act="pause" id="sp0" title="Pause (Space)">⏸</button>
    <button data-act="speed" data-arg="1" id="sp1" title="Speed 1 (key 1)">1×</button>
    <button data-act="speed" data-arg="2" id="sp2" title="Speed 2 (key 2)">2×</button>
    <button data-act="speed" data-arg="4" id="sp4" title="Speed 3 (key 3)">4×</button>
    <button data-act="speed" data-arg="8" id="sp8" title="Speed 4 (key 4)">8×</button>
  </div>
  <div class="menu">
    <button data-act="openTech" title="Tech tree (T)">Tech</button>
    <button data-act="openDiplo" title="Diplomacy (D)">Diplo<span class="long">macy</span></button>
    <button data-act="openEmpire" title="Empire overview (E)">Empire</button>
    <button data-act="openMenu" title="Menu (Esc)">☰</button>
  </div>
</div>

<div id="panel" class="hidden"></div>
<div id="toasts"></div>
<div id="mapctl" class="hidden">
  <button data-act="zoomIn" title="Zoom in">+</button>
  <button data-act="zoomOut" title="Zoom out">−</button>
  <button data-act="home" title="Centre on capital (H)">⌂</button>
</div>

<div id="modal" class="hidden">
  <div class="modal-box" id="modal-box">
    <div class="modal-head"><h2 id="modal-title"></h2><button class="x" data-act="closeModal" id="modal-close">✕</button></div>
    <div id="modal-body"></div>
  </div>
</div>

<div id="screen"></div>

<script>
'use strict';
/* =====================================================================
   STELLAR DOMINION — real-time grand strategy, fully offline
   ===================================================================== */

// ---------- utilities ----------
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function fmt(n) { const a = Math.abs(n); if (a >= 1e6) return (n / 1e6).toFixed(1) + 'M'; if (a >= 1e4) return (n / 1e3).toFixed(1) + 'k'; return Math.floor(n).toString(); }
function sgn(n, d = 1) { return (n >= 0 ? '+' : '') + n.toFixed(d); }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function pick(arr, r = Math.random) { return arr[Math.floor(r() * arr.length)]; }
function wpick(entries, r = Math.random) { let t = 0; for (const [, w] of entries) t += w; let x = r() * t; for (const [k, w] of entries) { if ((x -= w) <= 0) return k; } return entries[entries.length - 1][0]; }
function ordinal(n) { const s = ['th', 'st', 'nd', 'rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); }

// ---------- game data ----------
const PLANETS = {
  terran: { name: 'Terran', color: '#4caf50', hab: 1.0, min: 1.0, en: 1.0 },
  ocean: { name: 'Ocean', color: '#2196f3', hab: 0.9, min: 0.8, en: 1.1 },
  jungle: { name: 'Jungle', color: '#2e7d32', hab: 0.8, min: 0.9, en: 1.0 },
  desert: { name: 'Desert', color: '#e0a84a', hab: 0.7, min: 1.2, en: 1.0 },
  tundra: { name: 'Tundra', color: '#9ec9d6', hab: 0.6, min: 1.1, en: 0.9 },
  ice: { name: 'Ice', color: '#d6f0ff', hab: 0.35, min: 1.2, en: 0.8 },
  toxic: { name: 'Toxic', color: '#a4c639', hab: 0.25, min: 1.3, en: 1.3 },
  barren: { name: 'Barren', color: '#9e8e80', hab: 0.2, min: 1.6, en: 0.8 },
  molten: { name: 'Molten', color: '#ff5722', hab: 0.15, min: 1.8, en: 1.2 },
  gas: { name: 'Gas Giant', color: '#c79bd8', hab: 0.15, min: 0.6, en: 1.8 },
};
const PLANET_WEIGHTS = [['terran', 4], ['ocean', 5], ['jungle', 5], ['desert', 8], ['tundra', 7], ['ice', 8], ['toxic', 7], ['barren', 10], ['molten', 6], ['gas', 8]];
const STAR_COLORS = ['#fff4e0', '#ffd27a', '#ff9a6b', '#a8c8ff', '#ffffff', '#ffe9b0'];

const BUILDINGS = {
  mine: { name: 'Mining Complex', icon: '◆', cost: { minerals: 60 }, time: 10, jobs: 1, upkeep: 0.3, desc: '+4 minerals/day × planet richness' },
  power: { name: 'Power Plant', icon: '⚡', cost: { minerals: 60 }, time: 10, jobs: 1, upkeep: 0, desc: '+4 energy/day × planet richness' },
  lab: { name: 'Research Lab', icon: '🔬', cost: { minerals: 80, energy: 20 }, time: 14, jobs: 1, upkeep: 0.5, desc: '+3 research/day' },
  shipyard: { name: 'Shipyard', icon: '⚓', cost: { minerals: 120 }, time: 20, jobs: 1, upkeep: 1, unique: true, desc: 'Build ships here (1 per world)' },
  defense: { name: 'Defense Grid', icon: '🛡', cost: { minerals: 100 }, time: 16, jobs: 1, upkeep: 0.5, desc: '+100 planet defense, +4 planet firepower' },
  habitat: { name: 'Habitat Dome', icon: '⌂', cost: { minerals: 80 }, time: 14, jobs: 0, upkeep: 0.5, desc: '+3 pop capacity (no worker needed)' },
};
const SHIPS = {
  corvette: { name: 'Corvette', short: 'CV', hp: 30, atk: 4, speed: 42, cost: { minerals: 40 }, time: 8, upkeep: 0.2, tech: null, desc: 'Fast & cheap. Strong vs Battleships.' },
  destroyer: { name: 'Destroyer', short: 'DD', hp: 60, atk: 6, speed: 36, cost: { minerals: 80 }, time: 14, upkeep: 0.4, tech: null, desc: 'Flak screen. Strong vs Corvettes.' },
  cruiser: { name: 'Cruiser', short: 'CR', hp: 140, atk: 12, speed: 30, cost: { minerals: 170, energy: 20 }, time: 24, upkeep: 0.8, tech: 'cruisers', desc: 'Line ship. Strong vs Destroyers.' },
  battleship: { name: 'Battleship', short: 'BB', hp: 360, atk: 28, speed: 24, cost: { minerals: 400, energy: 60 }, time: 40, upkeep: 1.6, tech: 'battleships', desc: 'Heavy guns. Strong vs Cruisers, weak vs Corvettes.' },
  colony: { name: 'Colony Ship', short: 'COL', hp: 25, atk: 0, speed: 28, cost: { minerals: 90, energy: 40 }, time: 16, upkeep: 0.3, tech: null, desc: 'Settles an unclaimed world.' },
};
const WAR_CLASSES = ['corvette', 'destroyer', 'cruiser', 'battleship'];
const BONUS = { corvette: { battleship: 2.2 }, destroyer: { corvette: 2.2 }, cruiser: { destroyer: 1.8 }, battleship: { cruiser: 1.8, corvette: 0.5 } };
const bonus = (a, t) => (BONUS[a] && BONUS[a][t]) || 1;

const TECHS = {
  weapons1: { name: 'Laser Focusing', cat: 'Military', cost: 250, req: [], desc: '+15% ship damage' },
  weapons2: { name: 'Plasma Cannons', cat: 'Military', cost: 700, req: ['weapons1'], desc: '+15% ship damage' },
  weapons3: { name: 'Antimatter Lances', cat: 'Military', cost: 1600, req: ['weapons2'], desc: '+20% ship damage' },
  armor1: { name: 'Composite Armor', cat: 'Military', cost: 250, req: [], desc: '+15% ship hull' },
  armor2: { name: 'Neutronium Plating', cat: 'Military', cost: 700, req: ['armor1'], desc: '+15% ship hull' },
  armor3: { name: 'Adaptive Hulls', cat: 'Military', cost: 1600, req: ['armor2'], desc: '+20% ship hull' },
  flak: { name: 'Point Defense', cat: 'Military', cost: 450, req: ['weapons1'], desc: 'Destroyers deal +30% damage' },
  cruisers: { name: 'Cruiser Hulls', cat: 'Engineering', cost: 400, req: [], desc: 'Unlocks Cruisers' },
  battleships: { name: 'Battleship Hulls', cat: 'Engineering', cost: 1100, req: ['cruisers'], desc: 'Unlocks Battleships' },
  engines1: { name: 'Ion Thrusters', cat: 'Engineering', cost: 300, req: [], desc: '+20% fleet speed' },
  engines2: { name: 'Warp Drive', cat: 'Engineering', cost: 900, req: ['engines1'], desc: '+25% fleet speed' },
  logistics: { name: 'Fleet Logistics', cat: 'Engineering', cost: 500, req: [], desc: '−25% ship upkeep, 2× repair speed' },
  shields1: { name: 'Planetary Shields', cat: 'Engineering', cost: 350, req: [], desc: '+50% planet defense' },
  shields2: { name: 'Fortress Worlds', cat: 'Engineering', cost: 1000, req: ['shields1'], desc: '+50% planet defense, +50% planet firepower' },
  mining1: { name: 'Deep Core Mining', cat: 'Economy', cost: 300, req: [], desc: '+25% minerals' },
  mining2: { name: 'Asteroid Harvesting', cat: 'Economy', cost: 900, req: ['mining1'], desc: '+25% minerals' },
  power1: { name: 'Fusion Reactors', cat: 'Economy', cost: 300, req: [], desc: '+25% energy' },
  power2: { name: 'Dyson Collectors', cat: 'Economy', cost: 900, req: ['power1'], desc: '+25% energy' },
  research1: { name: 'Neural Networks', cat: 'Economy', cost: 350, req: [], desc: '+25% research' },
  research2: { name: 'Quantum Computing', cat: 'Economy', cost: 1000, req: ['research1'], desc: '+25% research' },
  hab1: { name: 'Terraforming', cat: 'Society', cost: 400, req: [], desc: '+20% habitability on every world' },
  genetics: { name: 'Gene Tailoring', cat: 'Society', cost: 600, req: ['hab1'], desc: '+50% pop growth, +2 pop cap per world' },
  admin: { name: 'Galactic Administration', cat: 'Society', cost: 500, req: [], desc: '+1 building slot on every world' },
  diplomacy: { name: 'Xeno-Diplomacy', cat: 'Society', cost: 300, req: [], desc: '+20 opinion with every empire' },
};
const TECH_CATS = ['Military', 'Engineering', 'Economy', 'Society'];

const DIFF = {
  easy: { name: 'Easy', mult: 0.75, ai: 3.0, mil: 0.6, war: 2.2, grace: 400 },
  normal: { name: 'Normal', mult: 1.0, ai: 2.0, mil: 1.0, war: 1.6, grace: 200 },
  hard: { name: 'Hard', mult: 1.3, ai: 1.3, mil: 1.3, war: 1.3, grace: 110 },
  insane: { name: 'Insane', mult: 1.7, ai: 0.9, mil: 1.6, war: 1.15, grace: 60 },
};
const PERS = {
  militarist: { name: 'Militarist', aggr: 1.4, mil: 1.3, expand: 1.0, sci: 0.8, op: -10 },
  expansionist: { name: 'Expansionist', aggr: 1.0, mil: 1.0, expand: 1.6, sci: 0.9, op: 0 },

  pacifist: { name: 'Pacifist', aggr: 0.5, mil: 0.8, expand: 1.1, sci: 1.1, op: 15 },
};
const SIZES = { small: { name: 'Small (32 systems)', n: 32 }, medium: { name: 'Medium (56 systems)', n: 56 }, large: { name: 'Large (84 systems)', n: 84 }, huge: { name: 'Huge (120 systems)', n: 120 } };
const COLORS = ['#4fc3f7', '#ef5350', '#66bb6a', '#ffca28', '#ab47bc', '#ff7043', '#26a69a', '#ec407a', '#d4e157', '#8d9eff'];
const AI_NAMES = ['Varn Hegemony', 'Quell Collective', 'Ossari Dominion', 'Thalan Republic', 'Krynn Swarm', 'Eidolon Union', 'Sareth Imperium', 'Nova Concord', 'Draxis Pact', 'Myrr Theocracy'];
const SYL1 = ['Al', 'Bel', 'Cor', 'Dra', 'Eri', 'Fen', 'Gal', 'Hel', 'Ix', 'Jor', 'Kel', 'Lun', 'Mor', 'Nex', 'Or', 'Pra', 'Qua', 'Ryn', 'Sol', 'Tau', 'Ul', 'Vex', 'Wyn', 'Xan', 'Yr', 'Zet', 'Ar', 'Ces', 'Del', 'Ka', 'Ma', 'No', 'Py', 'Si', 'Te', 'Vo', 'Ech', 'Ilt'];
const SYL2 = ['a', 'on', 'is', 'ar', 'us', 'ex', 'ia', 'or', 'en', 'ae', 'ion', 'ix', 'ara', 'eus', 'ola', 'um', 'eth', 'yx', 'ane', 'ori'];
const SUF = ['', '', '', '', '', '', ' Prime', ' Major', ' Minor', ' II', ' III', ' IV', ' Reach'];

// ---------- global state ----------
let G = null;              // the saved game state
let byStar = new Map();    // starId -> fleets currently at star (rebuilt each step)
let vis = new Uint8Array(0);
let distCache = new Map();
let sel = { star: null, fleet: null };
let modalKind = null, modalArg = null;
let dialogQueue = [];
let fx = [];
const cam = { x: 0, y: 0, z: 1 };
let W = 0, H = 0, DPR = 1;
const PLAYER = 0;

// ---------- core helpers ----------
const emp = id => G.empires[id];
function relKey(a, b) { return a < b ? a + '_' + b : b + '_' + a; }
function rel(a, b) { return G.rel[relKey(a, b)]; }
function relS(a, b) { if (a === b) return 'self'; const r = rel(a, b); return r ? r.s : 'peace'; }
function atWar(a, b) { return a !== b && a >= 0 && b >= 0 && relS(a, b) === 'war'; }
function allied(a, b) { return a === b || relS(a, b) === 'alliance'; }

function mods(e) {
  if (e._m) return e._m;
  const t = e.techs;
  return e._m = {
    dmg: 1 + (t.weapons1 ? .15 : 0) + (t.weapons2 ? .15 : 0) + (t.weapons3 ? .2 : 0),
    hp: 1 + (t.armor1 ? .15 : 0) + (t.armor2 ? .15 : 0) + (t.armor3 ? .2 : 0),
    speed: 1 + (t.engines1 ? .2 : 0) + (t.engines2 ? .25 : 0),
    upkeep: t.logistics ? .75 : 1, repair: t.logistics ? 2 : 1,
    def: 1 + (t.shields1 ? .5 : 0) + (t.shields2 ? .5 : 0), defAtk: t.shields2 ? 1.5 : 1,
    min: 1 + (t.mining1 ? .25 : 0) + (t.mining2 ? .25 : 0),
    en: 1 + (t.power1 ? .25 : 0) + (t.power2 ? .25 : 0),
    res: 1 + (t.research1 ? .25 : 0) + (t.research2 ? .25 : 0),
    hab: t.hab1 ? .2 : 0, growth: t.genetics ? 1.5 : 1, capBonus: t.genetics ? 2 : 0,
    slots: t.admin ? 1 : 0, flak: t.flak ? 1.3 : 1, opinion: t.diplomacy ? 20 : 0,
  };
}
function canAfford(e, cost) { return (e.res.minerals >= (cost.minerals || 0)) && (e.res.energy >= (cost.energy || 0)); }
function pay(e, cost, sign = 1) { e.res.minerals -= sign * (cost.minerals || 0); e.res.energy -= sign * (cost.energy || 0); }
function costStr(cost) { let s = ''; if (cost.minerals) s += '◆' + cost.minerals; if (cost.energy) s += ' ⚡' + cost.energy; return s.trim(); }
function costValue(cost) { return (cost.minerals || 0) + (cost.energy || 0) * 1.5; }

function countB(s, k) { let n = 0; for (const b of s.buildings) if (b === k) n++; return n; }
function jobs(s) { let j = 0; for (const b of s.buildings) j += BUILDINGS[b].jobs; return j; }
function isCapital(s) { return s.owner >= 0 && emp(s.owner).capital === s.id; }
function starHab(s, eid = s.owner) { const e = eid >= 0 ? emp(eid) : null; return clamp(PLANETS[s.type].hab + (e ? mods(e).hab : 0), 0.05, 1); }
function slots(s) { return s.size + (s.owner >= 0 ? mods(emp(s.owner)).slots : 0); }
function popCap(s) { const m = mods(emp(s.owner)); return Math.max(1, s.size * 1.5 * starHab(s) + countB(s, 'habitat') * 3 + m.capBonus + (isCapital(s) ? 3 : 0)); }
function defMax(s) { if (s.owner < 0) return 0; const m = mods(emp(s.owner)); return (60 + s.size * 15 + countB(s, 'defense') * 100 + (isCapital(s) ? 250 : 0)) * m.def; }
function planetAtk(s) { if (s.owner < 0) return 0; const m = mods(emp(s.owner)); return (2 + countB(s, 'defense') * 4 + (isCapital(s) ? 3 : 0)) * m.defAtk; }
function planetPower(s) { return s.owner < 0 ? 0 : Math.sqrt(planetAtk(s) * Math.max(0, s.defense)) * 1.2; }
function starOutput(s) {
  const e = emp(s.owner), m = mods(e), P = PLANETS[s.type];
  const j = jobs(s), fill = j ? Math.min(1, s.pop / j) : 0, unemployed = Math.max(0, s.pop - j);
  let en = countB(s, 'power') * 4 * P.en * fill + unemployed * 0.5 + s.pop * 0.1;
  let mi = countB(s, 'mine') * 4 * P.min * fill;
  let re = countB(s, 'lab') * 3 * fill + s.pop * 0.05;
  if (isCapital(s)) { en += 4; mi += 3; re += 3; }
  en *= m.en * e.mult; mi *= m.min * e.mult; re *= m.res * e.mult;
  let up = 0; for (const b of s.buildings) up += BUILDINGS[b].upkeep;
  return { en, mi, re, up };
}

// fleets
function fleetTotal(f) { let n = 0; for (const c in f.ships) n += f.ships[c].n; return n; }
function isArmed(f) { for (const c of WAR_CLASSES) if (f.ships[c] && f.ships[c].n > 0) return true; return false; }
function colonyOnly(f) { return !isArmed(f) && f.ships.colony && f.ships.colony.n > 0; }
function fleetSpeed(f) { let sp = Infinity; for (const c in f.ships) if (f.ships[c].n > 0) sp = Math.min(sp, SHIPS[c].speed); return (isFinite(sp) ? sp : 30) * mods(emp(f.owner)).speed; }
function shipPower(c, m) { const S = SHIPS[c]; return Math.sqrt(S.atk * m.dmg * (c === 'destroyer' ? m.flak : 1) * S.hp * m.hp); }
function fleetPower(f) { const m = mods(emp(f.owner)); let p = 0; for (const c in f.ships) { const sh = f.ships[c]; if (!sh.n) continue; const hpT = SHIPS[c].hp * m.hp * sh.n; p += sh.n * shipPower(c, m) * Math.max(0.2, 1 - sh.dmg / hpT); } return p; }
function fleetHull(f) { const m = mods(emp(f.owner)); let a = 0, b = 0; for (const c in f.ships) { const sh = f.ships[c]; const t = SHIPS[c].hp * m.hp * sh.n; a += t - sh.dmg; b += t; } return b ? a / b : 1; }
function addShips(f, c, n) { if (!f.ships[c]) f.ships[c] = { n: 0, dmg: 0 }; f.ships[c].n += n; }
function cleanFleet(f) { for (const c in f.ships) if (f.ships[c].n <= 0) delete f.ships[c]; }
function fleetName(e, colony) { if (colony) return 'Colony Ship'; e.fleetNo = (e.fleetNo || 0) + 1; return ordinal(e.fleetNo) + ' Fleet'; }
function newFleet(owner, at, name) { const f = { id: G.nextId++, owner, name, ships: {}, at, path: [], from: null, to: null, prog: 0, autoCol: false, target: null }; G.fleets.push(f); return f; }
function fleetPos(f) {
  if (f.at !== null) { const s = G.stars[f.at]; return [s.x, s.y]; }
  const a = G.stars[f.from], b = G.stars[f.to]; return [lerp(a.x, b.x, f.prog), lerp(a.y, b.y, f.prog)];
}
function fleetsAt(id) { return byStar.get(id) || []; }
function hostilePower(starId, eid) { let p = 0; for (const f of fleetsAt(starId)) if (atWar(f.owner, eid)) p += fleetPower(f); return p; }
function friendlyPower(starId, eid) { let p = 0; for (const f of fleetsAt(starId)) if (allied(f.owner, eid)) p += fleetPower(f); return p; }
function hostileArmedAt(starId, eid) { for (const f of fleetsAt(starId)) if (atWar(f.owner, eid) && isArmed(f)) return true; return false; }

// graph
function laneLen(a, b) { const A = G.stars[a], B = G.stars[b]; return Math.hypot(A.x - B.x, A.y - B.y); }
function dij(src) {
  if (distCache.has(src)) return distCache.get(src);
  const n = G.stars.length, dist = new Float64Array(n).fill(Infinity), prev = new Int32Array(n).fill(-1), done = new Uint8Array(n);
  dist[src] = 0;
  for (let it = 0; it < n; it++) {
    let u = -1, best = Infinity;
    for (let i = 0; i < n; i++) if (!done[i] && dist[i] < best) { best = dist[i]; u = i; }
    if (u < 0) break; done[u] = 1;
    for (const v of G.stars[u].lanes) { const d = best + laneLen(u, v); if (d < dist[v]) { dist[v] = d; prev[v] = u; } }
  }
  const r = { dist, prev }; distCache.set(src, r); return r;
}
function pathTo(r, src, dst) { const p = []; let c = dst; while (c !== src && c >= 0) { p.unshift(c); c = r.prev[c]; } return c === src ? p : null; }

// ---------- galaxy generation ----------
function genName(r, used) {
  for (let i = 0; i < 200; i++) {
    const n = pick(SYL1, r) + pick(SYL2, r) + (r() < 0.35 ? pick(SYL2, r) : '') + pick(SUF, r);
    if (!used.has(n)) { used.add(n); return n; }
  }
  const n = 'Sector ' + used.size; used.add(n); return n;
}
function genGalaxy(n, seed) {
  const r = mulberry32(seed);
  const minD = 100, area = n * minD * minD * 2.1, GW = Math.sqrt(area * 1.6), GH = area / GW;
  const pts = []; let tries = 0;
  while (pts.length < n && tries < n * 600) {
    tries++;
    const x = (r() - 0.5) * GW, y = (r() - 0.5) * GH;
    if ((x * x) / (GW * GW / 4) + (y * y) / (GH * GH / 4) > 1) continue;
    let ok = true; for (const p of pts) if (Math.hypot(p.x - x, p.y - y) < minD) { ok = false; break; }
    if (ok) pts.push({ x, y });
  }
  const N = pts.length, d = (i, j) => Math.hypot(pts[i].x - pts[j].x, pts[i].y - pts[j].y);
  // MST (Prim)
  const inT = new Uint8Array(N), best = new Float64Array(N).fill(Infinity), par = new Int32Array(N).fill(-1);
  const edges = new Set(); best[0] = 0;
  for (let it = 0; it < N; it++) {
    let u = -1, bv = Infinity; for (let i = 0; i < N; i++) if (!inT[i] && best[i] < bv) { bv = best[i]; u = i; }
    inT[u] = 1; if (par[u] >= 0) edges.add(Math.min(u, par[u]) + ',' + Math.max(u, par[u]));
    for (let v = 0; v < N; v++) if (!inT[v]) { const dv = d(u, v); if (dv < best[v]) { best[v] = dv; par[v] = u; } }
  }

  for (let i = 0; i < N; i++) for (let j = i + 1; j < N; j++) {
    const dd = d(i, j); if (dd > minD * 2.3) continue;
    const mx = (pts[i].x + pts[j].x) / 2, my = (pts[i].y + pts[j].y) / 2, rr = dd / 2;
    let ok = true; for (let k = 0; k < N; k++) { if (k === i || k === j) continue; if (Math.hypot(pts[k].x - mx, pts[k].y - my) < rr * 0.98) { ok = false; break; } }
    if (ok && r() < 0.72) edges.add(i + ',' + j);
  }
  const used = new Set();
  const stars = pts.map((p, i) => {
    const type = wpick(PLANET_WEIGHTS, r);
    return {
      id: i, x: Math.round(p.x), y: Math.round(p.y), name: genName(r, used), lanes: [],
      type, size: wpick([[2, 2], [3, 4], [4, 4], [5, 3], [6, 1]], r), sc: Math.floor(r() * STAR_COLORS.length),

}

function newGame(opts) {
  const seed = Math.floor(Math.random() * 1e9);
  const r = mulberry32(seed ^ 0x5bd1e995);
  const stars = genGalaxy(SIZES[opts.size].n, seed);
  const nEmp = 1 + opts.ais;
  G = {
    v: 1, seed, time: 0, speed: 1, paused: false, diff: opts.diff, size: opts.size,
    stars, empires: [], fleets: [], rel: {}, op: {}, nextId: 1, log: [], over: false, victoryShown: false,
  };
  distCache = new Map(); byStar = new Map(); fx = []; dialogQueue = [];
  // capitals: spread out
  const cands = stars.filter(s => s.lanes.length >= 2);
  const caps = [pick(cands, r)];
  while (caps.length < nEmp) {
    let best = null, bd = -1;
    for (const s of cands) { if (caps.includes(s)) continue; let md = Infinity; for (const c of caps) md = Math.min(md, Math.hypot(s.x - c.x, s.y - c.y)); md *= 0.85 + r() * 0.3; if (md > bd) { bd = md; best = s; } }
    caps.push(best);
  }
  const colors = COLORS.filter(c => c !== opts.color);
  const names = AI_NAMES.slice().sort(() => r() - 0.5);
  const persKeys = Object.keys(PERS);
  for (let i = 0; i < nEmp; i++) {
    const isP = i === 0;
    const e = {
      id: i, name: isP ? (opts.name || 'Terran Federation') : names[i - 1], color: isP ? opts.color : colors[(i - 1) % colors.length],
      isPlayer: isP, alive: true, pers: isP ? null : pick(persKeys, r), mult: isP ? 1 : DIFF[opts.diff].mult,
      res: { energy: 150, minerals: 200, research: 0 }, techs: {}, techProg: {}, researching: null,
      capital: caps[i].id, fleetNo: 0, aiT: 1 + r() * 2, diploT: 5 + r() * 10, power: 0, inc: { en: 0, mi: 0, re: 0 }, deficit: false, propT: 0, rally: null,
    };
    G.empires.push(e);
    const c = caps[i];
    c.owner = i; c.type = pick(['terran', 'ocean', 'jungle'], r); c.size = 6; c.pop = 8;
    c.buildings = ['mine', 'power', 'lab', 'shipyard'];
    // make neighbourhood fair: at least two decent worlds next door
    let good = 0;
    for (const nid of c.lanes) { const s = stars[nid]; if (PLANETS[s.type].hab >= 0.6) good++; }
    for (const nid of c.lanes) { if (good >= 2) break; const s = stars[nid]; if (PLANETS[s.type].hab < 0.6 && s.owner < 0) { s.type = pick(['desert', 'tundra', 'jungle', 'ocean'], r); s.size = Math.max(s.size, 3); good++; } }
  }
  for (const e of G.empires) { const c = stars[e.capital]; c.defense = defMax(c); }
  for (let a = 0; a < nEmp; a++) for (let b = 0; b < nEmp; b++) {
    if (a < b) G.rel[relKey(a, b)] = { s: 'peace', truce: 0, since: 0, loss: {} };
    if (a !== b) G.op[a + '>' + b] = 0;
  }
  for (const e of G.empires) {
    const f = newFleet(e.id, e.capital, fleetName(e)); addShips(f, 'corvette', 3); addShips(f, 'destroyer', 1);
    const c = newFleet(e.id, e.capital, 'Colony Ship'); addShips(c, 'colony', 1);
  }
  afterLoad();
  notify(`Welcome, leader of the ${G.empires[0].name}. Expand, research and conquer!`, { color: '#4fc3f7' });
}

function afterLoad() {
  distCache = new Map(); fx = []; sel = { star: null, fleet: null };
  for (const e of G.empires) e._m = null;
  rebuildIndex(); computeVis(); updateBorders(); updatePower();
  const cap = G.stars[G.empires[0].capital] || G.stars[0];
  cam.x = cap.x; cam.y = cap.y; cam.z = Math.min(W, H) < 700 ? 0.8 : 1;
}

// ---------- notifications ----------
function notify(msg, o = {}) {
  G.log.push({ d: Math.floor(G.time), m: msg, c: o.color || '#4fc3f7' });
  if (G.log.length > 150) G.log.shift();
  if (o.silent) return;
  toast(msg, o.color, o.star);
}
function toast(msg, color = '#4fc3f7', star = null) {
  const box = $('#toasts');
  while (box.children.length >= 4) box.firstChild.remove();
  const d = document.createElement('div');
  d.className = 'toast'; d.style.borderLeftColor = color; d.textContent = msg;
  if (star != null) { d.dataset.act = 'goto'; d.dataset.arg = star; }
  box.appendChild(d);
  setTimeout(() => d.remove(), 5500);
}

// ---------- simulation ----------
function rebuildIndex() {
  byStar = new Map();
  for (const f of G.fleets) if (f.at !== null) { let a = byStar.get(f.at); if (!a) byStar.set(f.at, a = []); a.push(f); }
}

let visT = 0, powT = 0, borderT = 0, winT = 0;
function step(dt) {
  G.time += dt;
  economy(dt);
  movement(dt);
  rebuildIndex();
  combat(dt);
  rebuildIndex();
  colonization(dt);
  upkeepStars(dt);
  // opinion decay
  const dec = Math.pow(0.99, dt);
  for (const k in G.op) G.op[k] *= dec;
  // AI
  for (const e of G.empires) {
    if (!e.alive || e.isPlayer) continue;
    e.aiT -= dt; if (e.aiT <= 0) { e.aiT = DIFF[G.diff].ai * (0.8 + Math.random() * 0.4); aiTick(e); }
    e.diploT -= dt; if (e.diploT <= 0) { e.diploT = 8 + Math.random() * 6; aiDiplo(e); }
  }
  if ((visT -= dt) <= 0) { visT = 0.3; computeVis(); }
  if ((powT -= dt) <= 0) { powT = 2; updatePower(); }
  if ((borderT -= dt) <= 0) { borderT = 5; updateBorders(); }
  if ((winT -= dt) <= 0) { winT = 2; checkVictory(); }
}

function economy(dt) {
  const inc = G.empires.map(() => ({ en: 0, mi: 0, re: 0, up: 0 }));
  for (const s of G.stars) {
    if (s.owner < 0) continue;
    const o = starOutput(s), t = inc[s.owner];
    t.en += o.en; t.mi += o.mi; t.re += o.re; t.up += o.up;
  }
  for (const f of G.fleets) { const m = mods(emp(f.owner)); for (const c in f.ships) inc[f.owner].up += f.ships[c].n * SHIPS[c].upkeep * m.upkeep; }
  for (const e of G.empires) {
    if (!e.alive) continue;
    const t = inc[e.id];
    if (e.deficit) { t.mi *= 0.5; t.re *= 0.5; }
    const net = t.en - t.up;
    e.inc = { en: net, mi: t.mi, re: t.re, up: t.up, gross: t.en };
    e.res.energy += net * dt; e.res.minerals += t.mi * dt; e.res.research += t.re * dt;
    if (e.res.energy < 0) { e.res.energy = 0; if (!e.deficit && e.isPlayer) notify('Energy deficit! Mineral and research output halved. Build power plants or reduce your fleet.', { color: '#ef5350' }); e.deficit = true; }
    else if (e.res.energy > 5) e.deficit = false;
    // research
    if (e.researching) {
      const k = e.researching, T = TECHS[k];
      const need = T.cost - (e.techProg[k] || 0), x = Math.min(need, e.res.research);
      e.techProg[k] = (e.techProg[k] || 0) + x; e.res.research -= x;
      if (e.techProg[k] >= T.cost - 1e-6) {
        e.techs[k] = true; e._m = null; e.researching = null;
        if (e.isPlayer) notify(`Research complete: ${T.name} (${T.desc})`, { color: '#b39ddb' });
      }
    }
  }
}

function upkeepStars(dt) {
  for (const s of G.stars) {
    if (s.owner < 0) continue;
    const e = emp(s.owner), m = mods(e);
    const besieged = hostileArmedAt(s.id, s.owner);
    // population
    const cap = popCap(s);
    if (s.pop < cap) s.pop = Math.min(cap, s.pop + (0.03 * s.pop * (1 - s.pop / cap) + 0.008) * m.growth * dt);
    else s.pop -= (s.pop - cap) * 0.05 * dt;
    // defense regen
    const dm = defMax(s);
    if (!besieged) s.defense = Math.min(dm, s.defense + dm * 0.025 * dt);
    else continue;
    if (s.defense > dm) s.defense = dm;
    // construction
    if (s.bq.length) {
      const q = s.bq[0]; q.p += dt;
      if (q.p >= q.t) {
        s.bq.shift();
        if (s.buildings.length < slots(s)) { s.buildings.push(q.k); if (e.isPlayer) notify(`${BUILDINGS[q.k].name} completed at ${s.name}`, { color: '#66bb6a', star: s.id, silent: true }); }
      }
    }
    if (s.sq.length && s.buildings.includes('shipyard')) {
      const q = s.sq[0]; q.p += dt;
      if (q.p >= q.t) { s.sq.shift(); spawnShip(s, q.k); }
    }
  }
  // repairs
  for (const f of G.fleets) {
    if (f.at === null) continue;
    const s = G.stars[f.at];
    if (s.owner < 0 || !allied(s.owner, f.owner) || G.time - (s._combat || -99) < 1) continue;
    const m = mods(emp(f.owner));
    for (const c in f.ships) { const sh = f.ships[c]; if (sh.dmg > 0) sh.dmg = Math.max(0, sh.dmg - SHIPS[c].hp * m.hp * 0.06 * m.repair * dt * Math.min(sh.n, 4)); }
  }
}

function spawnShip(s, c) {
  const e = emp(s.owner);
  let f = null;
  if (c !== 'colony') f = fleetsAt(s.id).find(g => g.owner === s.owner && !g.path.length && g.at === s.id && !colonyOnly(g) && isArmed(g));

});
function endPointer(e) {

  pointers.delete(e.pointerId);

}

function hitFleet(x, y) {
  let best = null, bd = 16;
  for (const h of fleetHits) { const d = Math.hypot(h.x - x, h.y - y); if (d < bd) { bd = d; best = h; } }
  if (!best) return null;
  if (best.stack && best.stack.length > 1 && best.stack.includes(sel.fleet)) return best.stack[(best.stack.indexOf(sel.fleet) + 1) % best.stack.length];
  return best.f;
}
function hitStar(x, y) {
  let best = null, bd = Infinity;
  for (const s of G.stars) { const [sx, sy] = w2s(s.x, s.y); const d = Math.hypot(sx - x, sy - y); if (d < Math.max(18, starR(s) + 8) && d < bd) { bd = d; best = s.id; } }
  return best;
}
function handleTap(x, y, button) {

  const myFleet = sel.fleet && sel.fleet.owner === PLAYER ? sel.fleet : null;
  if (button === 2) { if (myFleet && s != null) commandMove(myFleet, s); return; }
  if (f && !(myFleet && s != null && f.owner !== PLAYER)) { selectFleet(f); return; }
  if (s != null) { if (myFleet) { commandMove(myFleet, s); return; } selectStar(s); return; }
  sel.star = null; sel.fleet = null; refreshUI(true);
}
function commandMove(f, s) {
  if (orderMove(f, s)) {
    const st = G.stars[s];
    toast(f.at === s ? `${f.name} holding at ${st.name}` : `${f.name} → ${st.name}${f.autoCol ? ' (will colonize)' : ''}`, '#4fc3f7');
  } else toast('No route to that system', '#ef5350');
  refreshUI(true);
}
function selectFleet(f) { sel.fleet = f; sel.star = null; refreshUI(true); }

document.addEventListener('keydown', e => {

  if (e.key === 'Escape') { if (modalKind) actions.closeModal(); else if (sel.fleet || sel.star != null) { sel.fleet = null; sel.star = null; refreshUI(true); } else if (G) openModal('menu'); return; }

    h += `<div class="row"><div class="grow"><b>${SHIPS[c].name}</b> <span data-live="sn${c}"></span><br><small>${SHIPS[c].desc}</small>${bar('sh' + c, 'hp')}</div>${own && f.at !== null && Object.keys(f.ships).length > 1 ? `<button data-act="splitClass" data-arg="${c}" title="Split this ship type into its own fleet">Split</button>` : ''}</div>`;

function refreshUI(force) {
  if (!G) return;
  updateTopbar();
  const panel = $('#panel');
  let v = null;
  if (sel.fleet && G.fleets.includes(sel.fleet)) v = fleetPanel(sel.fleet);
  else if (sel.star != null) v = starPanel(G.stars[sel.star]);
  if (v) { panel.classList.remove('hidden'); if (force) panel._html = null; applyView(panel, v); $('#mapctl').classList.add('up'); }
  else { panel.classList.add('hidden'); panel._html = null; $('#mapctl').classList.remove('up'); }
  if (modalKind && ['tech', 'diplo', 'empire'].includes(modalKind)) renderModal();

// ---------- modals ----------

function toggleModal(kind) { if (modalKind === kind) actions.closeModal(); else if (!modalKind || ['tech', 'diplo', 'empire'].includes(modalKind)) openModal(kind); }
function modalPauses() { return modalKind && ['menu', 'dialog', 'gameover', 'help', 'load', 'save'].includes(modalKind); }
function showNextDialog() {

function diploView() {
  const p = emp(PLAYER), live = {};
  let h = `<p class="muted" style="margin-top:0">AI empires judge you by shared borders, wars, alliances, gifts and common enemies. Alliances are defensive: if someone declares war on an ally, the other joins in.</p>`;

    if (e.isPlayer) continue;
    const rs = e.alive ? relS(PLAYER, e.id) : 'dead';

    const r = rel(PLAYER, e.id);
    const ratio = e.power / Math.max(1, p.power);
    const strength = ratio > 1.6 ? 'Much stronger' : ratio > 1.15 ? 'Stronger' : ratio > 0.85 ? 'Comparable' : ratio > 0.55 ? 'Weaker' : 'Much weaker';
    const op = opinion(e.id, PLAYER);
    live['op' + e.id] = `${op > 0 ? '+' : ''}${op} (${opinionWord(op)})`;
    live['sys' + e.id] = String(G.stars.filter(s => s.owner === e.id).length);
    const wars = G.empires.filter(o => o.alive && o.id !== e.id && atWar(e.id, o.id)).map(o => o.id === PLAYER ? 'You' : o.name);
    const allies = G.empires.filter(o => o.alive && o.id !== e.id && relS(e.id, o.id) === 'alliance').map(o => o.id === PLAYER ? 'You' : o.name);
    h += `<div class="sub">${PERS[e.pers].name} · <span data-live="sys${e.id}"></span> systems · Military: ${strength}${borders(PLAYER, e.id) ? ' · Shares a border' : ''}</div>
      <div class="kv"><span>Opinion of you</span><b data-live="op${e.id}"></b></div>
      ${wars.length ? `<div class="sub">At war with: ${esc(wars.join(', '))}</div>` : ''}${allies.length ? `<div class="sub">Allied with: ${esc(allies.join(', '))}</div>` : ''}
      ${rs === 'peace' && r.truce > G.time ? `<div class="sub">Truce until day ${Math.ceil(r.truce)}</div>` : ''}<div class="btns">`;
    if (rs === 'war') h += `<button class="good" data-act="peace" data-arg="${e.id}">Propose peace</button>`;
    if (rs === 'peace') h += `<button class="danger" data-act="war" data-arg="${e.id}" ${r.truce > G.time ? 'disabled' : ''}>Declare war</button><button data-act="ally" data-arg="${e.id}">Propose alliance</button>`;
    if (rs === 'alliance') h += `<button data-act="breakAlly" data-arg="${e.id}">End alliance</button>`;
    h += `<button data-act="gift" data-arg="${e.id}" ${p.res.energy < 100 ? 'disabled' : ''}>Gift ⚡100</button></div></div>`;
  }
  return { html: h, live };
}

function empireView() {
  const e = emp(PLAYER), live = {};
  const stars = G.stars.filter(s => s.owner === PLAYER), fleets = G.fleets.filter(f => f.owner === PLAYER);
  live.esys = String(stars.length); live.epop = stars.reduce((a, s) => a + s.pop, 0).toFixed(1);
  live.epow = Math.round(e.power).toString(); live.eships = String(fleets.reduce((a, f) => a + fleetTotal(f), 0));
  live.einc = `⚡${sgn(e.inc.en || 0)}  ◆${sgn(e.inc.mi || 0)}  🔬${sgn(e.inc.re || 0)}`; live.eup = `⚡${(e.inc.up || 0).toFixed(1)}/day`;
  let h = `<div class="cols"><div>
    <div class="kv"><span>Systems</span><b data-live="esys"></b></div><div class="kv"><span>Population</span><b data-live="epop"></b></div>
    <div class="kv"><span>Ships</span><b data-live="eships"></b></div><div class="kv"><span>Military strength</span><b data-live="epow"></b></div>
    <div class="kv"><span>Net income/day</span><b data-live="einc"></b></div><div class="kv"><span>Total upkeep</span><span data-live="eup"></span></div>
    <div class="kv"><span>Technologies</span><span>${Object.keys(e.techs).length}/${Object.keys(TECHS).length}</span></div>
    <div class="kv"><span>Difficulty</span><span>${DIFF[G.diff].name}</span></div>
    <h4>Systems</h4>`;
  for (const s of stars.sort((a, b) => b.pop - a.pop)) h += `<div class="row"><span class="pl" style="background:${PLANETS[s.type].color}"></span><div class="grow">${esc(s.name)}${isCapital(s) ? ' ★' : ''} <small>pop ${s.pop.toFixed(0)} · ${s.buildings.length}/${slots(s)}${s.buildings.includes('shipyard') ? ' · ⚓' : ''}</small></div><button data-act="goto" data-arg="${s.id}">Go</button></div>`;
  h += `<h4>Fleets</h4>`;
  for (const f of fleets) h += `<div class="row"><div class="grow">${esc(f.name)} <small>${fleetTotal(f)} ships · ${f.at !== null && !f.path.length ? 'at ' + esc(G.stars[f.at].name) : 'moving'}</small></div><button data-act="gotoFleet" data-arg="${f.id}">Go</button></div>`;
  if (!fleets.length) h += `<div class="muted">No fleets.</div>`;
  h += `</div><div><h4 style="margin-top:0">Event log</h4><div class="log">`;
  for (const l of G.log.slice().reverse()) h += `<div><small>${dateStr(l.d)}</small> <span style="color:${l.c}">●</span> ${esc(l.m)}</div>`;
  h += `</div></div></div>`;
  return { html: h, live };
}

function menuView() {
  return `<div class="menu-btns" style="display:flex;flex-direction:column;gap:8px">
    <button class="primary" data-act="closeModal">Resume</button>
    <button data-act="openSave">Save game</button>
    <button data-act="openLoad">Load game</button>
    <button data-act="exportSave">Export save to file</button>
    <button data-act="importSave">Import save from file</button>
    <button data-act="openHelp">How to play</button>
    <button data-act="title">Quit to title (autosaves)</button>
  </div><p class="muted" style="font-size:12px;margin-bottom:0">The game autosaves every 2 minutes and when you leave the page. Saves are stored in this browser on this device — use Export to move a save to another device.</p>`;
}

// ---------- save / load ----------
const SLOT_KEYS = ['auto', '1', '2', '3'];
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }
function lsDel(k) { try { localStorage.removeItem(k); } catch (e) { } }
function serialize() { return JSON.stringify({ meta: { name: emp(PLAYER).name, color: emp(PLAYER).color, day: Math.floor(G.time), systems: G.stars.filter(s => s.owner === PLAYER).length, diff: G.diff, size: G.size, at: Date.now() }, game: G }, (k, v) => k[0] === '_' ? undefined : v); }
function saveTo(slot) { if (!G || (G.over && slot === 'auto')) return false; return lsSet('stellar_dominion_' + slot, serialize()); }
function slotMeta(slot) { const raw = lsGet('stellar_dominion_' + slot); if (!raw) return null; try { return JSON.parse(raw).meta; } catch (e) { return null; } }
function loadData(obj) {
  if (!obj || !obj.game || !obj.game.stars) throw new Error('Not a Stellar Dominion save');
  G = obj.game; G.paused = true;
  afterLoad(); startPlaying();
  toast(`Loaded — day ${Math.floor(G.time)}. Game is paused; press ▶ to continue.`, '#66bb6a');
}
function loadFrom(slot) { const raw = lsGet('stellar_dominion_' + slot); if (!raw) return; try { loadData(JSON.parse(raw)); } catch (e) { toast('Could not load save: ' + e.message, '#ef5350'); } }
function slotsView(mode) {
  let h = '';
  for (const k of SLOT_KEYS) {
    if (mode === 'save' && k === 'auto') continue;
    const m = slotMeta(k);
    h += `<div class="row"><div class="grow"><b>${k === 'auto' ? 'Autosave' : 'Slot ' + k}</b><br><small>${m ? `${esc(m.name)} · ${dateStr(m.day)} · ${m.systems} systems · ${new Date(m.at).toLocaleString()}` : 'Empty'}</small></div>`;
    if (mode === 'save') h += `<button class="primary" data-act="saveSlot" data-arg="${k}">Save</button>`;
    else if (m) h += `<button class="primary" data-act="loadSlot" data-arg="${k}">Load</button><button data-act="delSlot" data-arg="${k}" title="Delete">🗑</button>`;
    h += `</div>`;
  }
  if (mode === 'load') h += `<div class="btns"><button data-act="importSave">Import from file…</button></div>`;
  return h;
}
function exportSave() {
  const blob = new Blob([serialize()], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = `stellar-dominion-${dateStr(G.time)}.json`; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function importSave() {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json,application/json';
  inp.onchange = () => { const f = inp.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => { try { loadData(JSON.parse(rd.result)); } catch (e) { toast('Import failed: ' + e.message, '#ef5350'); } }; rd.readAsText(f); };
  inp.click();
}
setInterval(() => { if (G && !G.over && $('#screen').style.display === 'none') saveTo('auto'); }, 120000);
document.addEventListener('visibilitychange', () => { if (document.hidden && G && $('#screen').style.display === 'none') saveTo('auto'); });
window.addEventListener('pagehide', () => { if (G && $('#screen').style.display === 'none') saveTo('auto'); });

// ---------- screens ----------
let ngColor = COLORS[0];
function showScreen(html) { const s = $('#screen'); s.innerHTML = html; s.style.display = 'flex'; $('#topbar').classList.add('hidden'); $('#panel').classList.add('hidden'); $('#mapctl').classList.add('hidden'); }
function titleScreen() {
  const hasAuto = !!slotMeta('auto'), anySave = SLOT_KEYS.some(k => slotMeta(k));
  showScreen(`<div class="scr"><h1>STELLAR DOMINION</h1><div class="tag">Real-time galactic grand strategy · plays fully offline</div>
    <div class="menu-btns">
      ${hasAuto ? '<button class="primary" data-act="continue">Continue</button>' : ''}
      <button class="${hasAuto ? '' : 'primary'}" data-act="newGameScreen">New game</button>
      ${anySave ? '<button data-act="loadScreen">Load game</button>' : ''}
      <button data-act="importSave">Import save file</button>
      <button data-act="helpScreen">How to play</button>
    </div></div>`);
}
function newGameScreen() {
  showScreen(`<div class="scr"><h1 style="font-size:32px">New Game</h1><div class="form">
    <label>Empire name<input id="ng-name" maxlength="32" value="Terran Federation"></label>
    <label>Empire colour<div class="swatches">${COLORS.map(c => `<button class="swatch ${c === ngColor ? 'on' : ''}" style="background:${c}" data-act="ngColor" data-arg="${c}"></button>`).join('')}</div></label>
    <label>Galaxy size<select id="ng-size">${Object.entries(SIZES).map(([k, v]) => `<option value="${k}" ${k === 'medium' ? 'selected' : ''}>${v.name}</option>`).join('')}</select></label>
    <label>AI rivals: <b id="ng-ai-v">4</b><input type="range" id="ng-ai" min="1" max="7" value="4" oninput="document.getElementById('ng-ai-v').textContent=this.value"></label>
    <label>Difficulty<select id="ng-diff">${Object.entries(DIFF).map(([k, v]) => `<option value="${k}" ${k === 'normal' ? 'selected' : ''}>${v.name}</option>`).join('')}</select></label>
    <div class="btns" style="justify-content:space-between"><button data-act="title">Back</button><button class="primary" data-act="startGame">Launch ▶</button></div>
  </div></div>`);
}
function loadScreen() {
  showScreen(`<div class="scr"><h1 style="font-size:32px">Load Game</h1><div class="form">${slotsView('load')}<div class="btns"><button data-act="title">Back</button></div></div></div>`);
}
function helpScreen() { showScreen(`<div class="scr" style="width:min(760px,100%)"><div class="form">${helpHtml()}<div class="btns"><button class="primary" data-act="title">Back</button></div></div></div>`); }
function startPlaying() {
  $('#screen').style.display = 'none'; $('#screen').innerHTML = '';
  $('#topbar').classList.remove('hidden'); $('#mapctl').classList.remove('hidden');
  modalKind = null; $('#modal').classList.add('hidden');
  refreshUI(true);
}
function helpHtml() {
  return `<div class="help">
  <h3>Goal</h3>Grow from a single world into a galactic empire. You win by destroying every rival <b>or</b> controlling 60% of all systems. You lose if your last system falls.
  <h3>Time</h3>The game runs in real time. Use <b>⏸ / 1× / 2× / 4× / 8×</b> (keys <b>Space, 1–4</b>). Pause any time to plan — orders can be given while paused.
  <h3>Controls</h3><ul>
   <li><b>Pan:</b> drag the map. <b>Zoom:</b> mouse wheel or pinch. <b>⌂</b> centres on your capital.</li>
   <li><b>Select</b> a system or fleet by tapping/clicking it.</li>
   <li><b>Move:</b> with one of your fleets selected, tap/click any system (or right-click on desktop). Fleets travel along hyperlanes.</li>
   <li>Tap empty space or ✕ to deselect. Keys: <b>T</b> tech, <b>D</b> diplomacy, <b>E</b> empire, <b>H</b> home, <b>Esc</b> menu.</li></ul>
  <h3>Economy</h3><ul>
   <li><b>⚡ Energy</b> pays upkeep for ships and buildings. Running out halves mineral and research output.</li>
   <li><b>◆ Minerals</b> build everything. <b>🔬 Research</b> unlocks technologies.</li>
   <li>Each building needs <b>1 worker</b> (population) except Habitat Domes. Population grows toward the planet's cap, set by size and habitability.</li>
   <li>Planet types have richness multipliers: Barren/Molten worlds are mineral-rich, Gas Giants energy-rich, Terran/Ocean worlds grow big populations.</li></ul>
  <h3>Expansion</h3>Build a <b>Colony Ship</b> at a shipyard and send it to an unclaimed system — it colonizes automatically on arrival (15 days). Hostile warships disrupt colonization.
  <h3>Ships &amp; combat</h3>Fleets fight automatically when they meet an enemy you're at war with. Planets shoot back with their defense; once a planet's defense hits zero and no defending warships remain, it is <b>captured</b>.
  <table><tr><th>Ship</th><th>Strong vs</th><th>Notes</th></tr>
   <tr><td>Corvette</td><td>Battleship</td><td>Fast, cheap swarm</td></tr>
   <tr><td>Destroyer</td><td>Corvette</td><td>Anti-swarm flak</td></tr>
   <tr><td>Cruiser</td><td>Destroyer</td><td>Needs Cruiser Hulls</td></tr>
   <tr><td>Battleship</td><td>Cruiser</td><td>Needs Battleship Hulls; weak vs Corvettes</td></tr></table>
   Look at what the enemy fields and build the counter. Fleets repair slowly in your own (or allied) systems. A fleet passing through a system held by enemy warships is stopped there.
  <h3>Diplomacy</h3>Every pair of empires is at <b>peace</b>, <b>war</b> or in an <b>alliance</b>. AIs remember your actions: gifts raise opinion, wars and shared borders lower it, common enemies bring you together. Peace forces a 150-day truce. AIs may declare war when they think you are weak — keep a fleet!
  <h3>Saving</h3>Autosaves every 2 minutes and whenever you leave the page. Manual save slots are in the ☰ menu. Saves live in this browser; use <b>Export</b>/<b>Import</b> to move them.
  </div>`;
}

// ---------- actions ----------
const actions = {
  closeModal() {
    if (modalKind === 'dialog') return;
    const wasGameover = modalKind === 'gameover';
    modalKind = null; $('#modal').classList.add('hidden');
    if (wasGameover && G && G.over) { computeVis(); }
    if (dialogQueue.length) showNextDialog();
  },
  deselect() { sel.fleet = null; sel.star = null; refreshUI(true); },
  selFleet(id) { const f = G.fleets.find(x => x.id === +id); if (f) selectFleet(f); },
  viewStar(id) { selectStar(+id); },
  goto(id) { if (!G) return; id = +id; centerOn(id); if (modalKind && !['dialog', 'gameover'].includes(modalKind)) actions.closeModal(); if (!(sel.fleet && sel.fleet.owner === PLAYER)) selectStar(id); },
  gotoFleet(id) { const f = G.fleets.find(x => x.id === +id); if (!f) return; const [x, y] = fleetPos(f); cam.x = x; cam.y = y; actions.closeModal(); selectFleet(f); },
  build(k) { const s = G.stars[sel.star]; const err = queueBuilding(emp(PLAYER), s, k); if (err) toast(err, '#ef5350'); refreshUI(true); },
  cancelB(i) { const s = G.stars[sel.star]; const q = s.bq.splice(+i, 1)[0]; if (q) pay(emp(PLAYER), BUILDINGS[q.k].cost, -1); refreshUI(true); },
  demolish(i) { const s = G.stars[sel.star]; const b = s.buildings[+i]; if (!b) return; s.buildings.splice(+i, 1); if (b === 'shipyard' && !s.buildings.includes('shipyard')) { for (const q of s.sq) pay(emp(PLAYER), SHIPS[q.k].cost, -1); s.sq = []; } toast(`${BUILDINGS[b].name} demolished`, '#ffca28'); refreshUI(true); },
  ship(c) { const s = G.stars[sel.star]; const err = queueShip(emp(PLAYER), s, c); if (err) toast(err, '#ef5350'); refreshUI(true); },
  cancelS(i) { const s = G.stars[sel.star]; const q = s.sq.splice(+i, 1)[0]; if (q) pay(emp(PLAYER), SHIPS[q.k].cost, -1); refreshUI(true); },
  split() { const g = splitFleet(sel.fleet); if (g) toast(`Split off ${g.name}`, '#4fc3f7'); refreshUI(true); },
  splitClass(c) { const g = splitFleet(sel.fleet, c); if (g) toast(`${SHIPS[c].name}s split into ${g.name}`, '#4fc3f7'); refreshUI(true); },
  merge() { const n = mergeHere(sel.fleet); if (n) toast(`Merged ${n} fleet${n > 1 ? 's' : ''} into ${sel.fleet.name}`, '#4fc3f7'); refreshUI(true); },
  stop() { const f = sel.fleet; f.path = []; f.autoCol = false; refreshUI(true); },
  colonize() { startColonize(sel.fleet); refreshUI(true); },
  sendColony(id) {
    id = +id; const cols = G.fleets.filter(f => f.owner === PLAYER && colonyOnly(f));
    let best = null, bd = Infinity; const d = dij(id).dist;
    for (const f of cols) { const at = f.at !== null ? f.at : f.to; if (d[at] < bd) { bd = d[at]; best = f; } }
    if (best) { orderMove(best, id); toast(`${best.name} → ${G.stars[id].name} (will colonize)`, '#66bb6a'); }
    refreshUI(true);
  },
  research(k) { emp(PLAYER).researching = k; refreshUI(true); },
  pause() { G.paused = !G.paused; refreshUI(); },
  speed(v) { G.speed = +v; G.paused = false; refreshUI(); },
  openTech() { if (G && !G.over) openModal('tech'); },
  openDiplo() { if (G) openModal('diplo'); },
  openEmpire() { if (G) openModal('empire'); },
  openMenu() { openModal('menu'); },
  openSave() { openModal('save'); },
  openLoad() { openModal('load'); },
  openHelp() { openModal('help'); },
  war(id, el) {
    if (el.dataset.confirm !== '1') { el.dataset.confirm = '1'; el.textContent = 'Confirm war?'; return; }
    const err = declareWar(PLAYER, +id); if (err) toast(err, '#ef5350'); renderModal();
  },
  peace(id) {
    const e = emp(+id), r = rel(PLAYER, e.id);
    if (G.time < (e._peaceAsk || -99)) { toast(`The ${e.name} won't consider peace again so soon.`, '#ffca28'); return; }
    e._peaceAsk = G.time + 30;
    if (aiWantsPeace(e, emp(PLAYER)) || (opinion(e.id, PLAYER) > 0 && G.time - r.since > 60)) makePeace(PLAYER, e.id);
    else toast(`The ${e.name} refuses peace — hurt them more first.`, '#ef5350');
    renderModal();
  },
  ally(id) {
    const e = emp(+id);
    if (aiAcceptsAlliance(e, emp(PLAYER))) makeAlliance(PLAYER, e.id);
    else toast(`The ${e.name} declines (needs opinion > 40 and a common enemy, or > 65).`, '#ffca28');
    renderModal();
  },
  breakAlly(id) { breakAlliance(PLAYER, +id); renderModal(); },
  gift(id) {
    const p = emp(PLAYER); if (p.res.energy < 100) return;
    p.res.energy -= 100; const k = id + '>' + PLAYER, cur = G.op[k] || 0;
    G.op[k] = cur + 20 * (1 - clamp(cur, 0, 90) / 100);
    toast(`Gift sent to the ${emp(+id).name}. Opinion improved.`, '#66bb6a'); renderModal();
  },
  dialogYes() { const d = modalArg; modalKind = null; $('#modal').classList.add('hidden'); if (d.kind === 'peace') makePeace(PLAYER, d.from); else makeAlliance(PLAYER, d.from); showNextDialog(); },
  dialogNo() { const d = modalArg; modalKind = null; $('#modal').classList.add('hidden'); G.op[d.from + '>' + PLAYER] = (G.op[d.from + '>' + PLAYER] || 0) - 5; showNextDialog(); },
  saveSlot(k) { if (saveTo(k)) toast(`Saved to slot ${k}`, '#66bb6a'); else toast('Save failed (storage unavailable?) — try Export instead.', '#ef5350'); renderModal(); },
  loadSlot(k) { loadFrom(k); },
  delSlot(k) { lsDel('stellar_dominion_' + k); if ($('#screen').style.display === 'none') renderModal(); else { SLOT_KEYS.some(x => slotMeta(x)) ? loadScreen() : titleScreen(); } },
  exportSave() { if (G) exportSave(); },
  importSave() { importSave(); },
  continue() { loadFrom('auto'); },
  newGameScreen() { if (G && !G.over && $('#screen').style.display === 'none') saveTo('auto'); modalKind = null; $('#modal').classList.add('hidden'); newGameScreen(); },
  loadScreen() { loadScreen(); },
  helpScreen() { helpScreen(); },
  title() { if (G && !G.over && $('#screen').style.display === 'none') saveTo('auto'); modalKind = null; $('#modal').classList.add('hidden'); G = null; titleScreen(); },
  ngColor(c, el) { ngColor = c; document.querySelectorAll('.swatch').forEach(s => s.classList.toggle('on', s === el)); },
  startGame() {
    const opts = { name: $('#ng-name').value.trim() || 'Terran Federation', color: ngColor, size: $('#ng-size').value, ais: +$('#ng-ai').value, diff: $('#ng-diff').value };
    const maxAI = Math.floor(SIZES[opts.size].n / 7) - 1; if (opts.ais > maxAI) { opts.ais = maxAI; }
    newGame(opts); startPlaying();
    setTimeout(() => toast('Tip: tap your capital (★) to construct buildings and ships. Pause with ⏸ any time.', '#4fc3f7'), 1200);
  },
  zoomIn() { zoomAt(W / 2, H / 2, 1.3); },
  zoomOut() { zoomAt(W / 2, H / 2, 1 / 1.3); },
  home() { if (G && emp(PLAYER).capital >= 0) centerOn(emp(PLAYER).capital); },
};
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t || t.disabled) return;
  const fn = actions[t.dataset.act]; if (fn) { fn(t.dataset.arg, t); }
});

// ---------- main loop ----------
let last = performance.now(), uiT = 0;
function frame(t) {
  const dt = Math.min(0.1, (t - last) / 1000); last = t;
  if (G && $('#screen').style.display === 'none') {
    if (!G.paused && !modalPauses()) {
      let gd = dt * G.speed;
      while (gd > 1e-6) { const s = Math.min(gd, 0.1); step(s); gd -= s; }
    }
    for (const e of fx) e.t += dt; fx = fx.filter(e => e.t < (e.big ? 1.2 : 0.7));
    draw(t);
    uiT += dt; if (uiT > 0.25) { uiT = 0; refreshUI(); }
  } else draw(t);
  requestAnimationFrame(frame);
}
titleScreen();
requestAnimationFrame(frame);

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => { }));
}
</script>
